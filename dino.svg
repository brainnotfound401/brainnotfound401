<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210">
<style>
  .world { animation: scroll 4.0s linear infinite; }
  .sky { animation: scroll 16.0s linear infinite; }
  .dino { animation: jump 4.0s linear infinite; }
  .legA { animation: legA .2s steps(1) infinite; }
  .legB { animation: legB .2s steps(1) infinite; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-900px); } }
  @keyframes jump { 0% { transform: translateY(0); } 14.78% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.7,.4,1); } 23.78% { transform: translateY(-80px); animation-timing-function: cubic-bezier(.6,0,.8,.3); } 32.78% { transform: translateY(0); } 40.33% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.7,.4,1); } 49.33% { transform: translateY(-80px); animation-timing-function: cubic-bezier(.6,0,.8,.3); } 58.33% { transform: translateY(0); } 64.78% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.7,.4,1); } 73.78% { transform: translateY(-80px); animation-timing-function: cubic-bezier(.6,0,.8,.3); } 82.78% { transform: translateY(0); } 100% { transform: translateY(0); } }
  @keyframes legA { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes legB { 0% { opacity: 0; } 50% { opacity: 1; } }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
