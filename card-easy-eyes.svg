<svg xmlns="http://www.w3.org/2000/svg" width="440" height="230" viewBox="0 0 440 230">
<style>
  .n { font: 800 24px -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #fff; }
  .k { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #888; letter-spacing: 1px; }
  .d { font: 13.5px -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #bdbdbd; }
  .t { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #ddd; }
  .b { font: 800 11px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #000; letter-spacing: 1px; }
  .e { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #000; }
  .arrow { animation: nudge 1.4s ease-in-out infinite; }
  .cur { animation: blink 1s steps(1) infinite; }
  @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
  @keyframes blink { 50% { opacity: 0; } }
</style>
